name = "axis-trigger"
main = "src/server.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
NODE_ENV = "production"
ASSET_CONFIG_FILE = "assets.json"

[limits]
cpu_ms = 300_000

[[d1_databases]]
binding = "DB"            # available as env.DB
database_name = "axis_trigger"
database_id = "050c6983-91e7-49cc-972b-0dc1c185bbae"

[triggers]
crons = ["0 * * * *"]  # run every hour